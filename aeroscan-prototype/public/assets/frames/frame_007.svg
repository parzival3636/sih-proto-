    <text x="25" y="47" fill="#8b949e" font-family="monospace" font-size="10">GPS: 18.5222° N, 73.8591° E | ALT: 45.2m</text>

    <text x="500" y="32" fill="#22c55e" font-family="monospace" font-size="11" font-weight="bold">● LIVE 4K STREAM</text>
    <text x="500" y="47" fill="#8b949e" font-family="monospace" font-size="10">FRAME #05052</text>

